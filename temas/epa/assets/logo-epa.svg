<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="EPA · Escuela de Patín Artístico">
  <!-- Logo de EPA redibujado en vector (21/11/2026) desde su foto de perfil de Instagram (150 px): el círculo blanco,
       los aros azul y rosa, las estrellitas doradas, "EPA" en azul francia y el patín. Hasta que la escuela mande el original. -->
  <defs>
    <style>
      .epa{font:italic 900 182px 'Montserrat','Arial Black',sans-serif;letter-spacing:-6px;fill:#0b2de6}
      .esc{font:700 30px 'Montserrat',Arial,sans-serif;letter-spacing:7px;fill:#1a33c9}
      .pat{font:900 42px 'Montserrat','Arial Black',sans-serif;letter-spacing:2.5px;fill:#1a33c9}
    </style>
    <symbol id="estrella" viewBox="-10 -10 20 20"><path d="M0-10C1-3 3-1 10 0 3 1 1 3 0 10-1 3-3 1-10 0-3-1-1-3 0-10Z" fill="#e8b23a"/></symbol>
  </defs>
  <circle cx="300" cy="300" r="296" fill="#fff"/>
  <!-- aros: azul afuera, rosa adentro, abiertos donde salen las letras y el patín -->
  <path d="M478 104A262 262 0 0 0 112 128" fill="none" stroke="#2341e8" stroke-width="5" stroke-linecap="round"/>
  <path d="M160 156A214 214 0 0 1 418 128" fill="none" stroke="#f2a9cb" stroke-width="5" stroke-linecap="round"/>
  <path d="M60 430A262 262 0 0 0 470 500" fill="none" stroke="#2341e8" stroke-width="5" stroke-linecap="round"/>
  <path d="M150 470A230 230 0 0 0 420 482" fill="none" stroke="#f2a9cb" stroke-width="5" stroke-linecap="round"/>
  <use href="#estrella" x="58" y="108" width="40" height="40"/>
  <use href="#estrella" x="104" y="70" width="28" height="28"/>
  <use href="#estrella" x="42" y="168" width="18" height="18"/>
  <use href="#estrella" x="522" y="440" width="36" height="36"/>
  <use href="#estrella" x="472" y="478" width="30" height="30"/>
  <use href="#estrella" x="540" y="408" width="16" height="16"/>
  <!-- EPA -->
  <text class="epa" x="72" y="332">EPA</text>
  <!-- el patín: bota alta redondeada, ojalillos en el frente, plancha y ruedas rosas, freno adelante -->
  <g transform="translate(404 168)" stroke="#6b55c9" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M24 4C38 0 64 0 78 4c4 22 6 44 8 66 18 10 46 18 66 26 9 4 12 12 12 22H14C12 86 14 40 18 12c1-5 3-7 6-8Z" fill="#fff"/>
    <path d="M60 18l20-4M62 32l21-4M64 46l21-4M66 60l21-4" fill="none" stroke="#6b55c9" stroke-width="3.5"/>
    <circle cx="80" cy="14" r="3.6" fill="#6b55c9" stroke="none"/><circle cx="83" cy="28" r="3.6" fill="#6b55c9" stroke="none"/>
    <circle cx="85" cy="42" r="3.6" fill="#6b55c9" stroke="none"/><circle cx="87" cy="56" r="3.6" fill="#6b55c9" stroke="none"/>
    <path d="M14 126h150" fill="none" stroke="#f08dbd" stroke-width="7"/>
    <circle cx="42" cy="146" r="18" fill="#f6b6d4"/><circle cx="42" cy="146" r="6.5" fill="#fff"/>
    <circle cx="132" cy="146" r="18" fill="#f6b6d4"/><circle cx="132" cy="146" r="6.5" fill="#fff"/>
    <path d="M164 114l15 3-1 18-14-3Z" fill="#f08dbd"/>
  </g>
  <!-- ESCUELA DE, entre dos rayas rosas -->
  <path d="M70 380h104M428 380h104" stroke="#f2a9cb" stroke-width="5" stroke-linecap="round"/>
  <text class="esc" x="301" y="391" text-anchor="middle">ESCUELA DE</text>
  <text class="pat" x="301" y="448" text-anchor="middle">PATÍN ARTÍSTICO</text>
</svg>
